        <h1>WearView — 3D Wear OS Smartwatch Screen Preview, Safe Zones &amp; AOD Burn-In Checker</h1>
        <p>WearView is a free, zero-upload WebGL tool for Wear OS app developers, watch face designers, and Unity game creators. Paste, drop, or live-capture your Android Studio Emulator or Unity Game view onto 21 physically accurate 3D smartwatch models directly in the browser.</p>
        <h2>Key Ergonomics &amp; QA Features</h2>
        <ul>
          <li>21 accurate 3D Wear OS smartwatch models across 4 device families (Google Pixel Watch, Samsung Galaxy Watch Modern Flat, Classic/Pro/Ultra, OnePlus/Xiaomi/Mobvoi).</li>
          <li>1:1 physical size calibration using a standard ISO/IEC 7810 ID-1 bank card (85.60 mm) or manual PPI slider.</li>
          <li>80% text safe zone and 90% action safe zone circular overlays with custom danger threshold.</li>
          <li>14mm physical finger touch target overlay in calibrated 1:1 mode.</li>
          <li>2-second wrist-raise glanceability test.</li>
          <li>OLED Always-On Display (AOD) &lt;10% On-Pixel Ratio (OPR) and luminance burn-in heatmap.</li>
          <li>Camera angle presets (0° Front, 35° Wrist Tilt, 75° Extreme Bezel Side View) and 1-click transparent PNG snapshot.</li>
          <li>Live screen/window capture from Android Studio Emulator or Unity Editor plus postMessage bridge.</li>
        </ul>
